<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SHL Assessment Recommender</title>
  <meta name="description" content="AI-powered conversational tool to find the right SHL assessments for your hiring needs." />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg-primary: #0a0e1a;
      --bg-secondary: #111827;
      --bg-card: rgba(255,255,255,0.04);
      --bg-glass: rgba(255,255,255,0.06);
      --border: rgba(255,255,255,0.08);
      --text-primary: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #6366f1;
      --accent-glow: rgba(99,102,241,0.25);
      --accent-2: #818cf8;
      --green: #34d399;
      --amber: #fbbf24;
      --user-bubble: linear-gradient(135deg, #6366f1, #8b5cf6);
      --bot-bubble: rgba(255,255,255,0.05);
      --radius: 16px;
      --radius-sm: 10px;
    }

    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* ── Header ─────────────────────────────── */
    .header {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 28px;
      background: rgba(17,24,39,0.85);
      backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border);
      z-index: 10;
      flex-shrink: 0;
    }
    .header-logo {
      width: 42px; height: 42px;
      background: var(--user-bubble);
      border-radius: 12px;
      display: grid; place-items: center;
      font-size: 20px; font-weight: 800; color: #fff;
      box-shadow: 0 0 20px var(--accent-glow);
    }
    .header-text h1 { font-size: 18px; font-weight: 700; letter-spacing: -0.3px; }
    .header-text p { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
    .header-status {
      margin-left: auto;
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--green); font-weight: 500;
    }
    .header-status::before {
      content: '';
      width: 7px; height: 7px;
      background: var(--green);
      border-radius: 50%;
      animation: pulse-dot 2s ease infinite;
    }
    @keyframes pulse-dot {
      0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(52,211,153,0.5); }
      50% { opacity: 0.7; box-shadow: 0 0 0 6px rgba(52,211,153,0); }
    }

    /* ── Chat Area ──────────────────────────── */
    .chat-container {
      flex: 1;
      overflow-y: auto;
      padding: 28px 20px;
      scroll-behavior: smooth;
    }
    .chat-container::-webkit-scrollbar { width: 5px; }
    .chat-container::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.1); border-radius: 10px; }

    .messages-wrapper {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    /* ── Welcome ────────────────────────────── */
    .welcome {
      text-align: center;
      padding: 50px 20px 30px;
      animation: fadeUp 0.6s ease;
    }
    .welcome-icon {
      width: 72px; height: 72px;
      background: var(--user-bubble);
      border-radius: 22px;
      display: inline-grid; place-items: center;
      font-size: 34px;
      margin-bottom: 20px;
      box-shadow: 0 8px 40px var(--accent-glow);
    }
    .welcome h2 { font-size: 26px; font-weight: 800; letter-spacing: -0.5px; margin-bottom: 8px; }
    .welcome p { color: var(--text-secondary); font-size: 15px; max-width: 460px; margin: 0 auto 24px; line-height: 1.6; }

    .quick-prompts {
      display: flex; flex-wrap: wrap; gap: 8px; justify-content: center;
    }
    .quick-prompt {
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 10px 18px;
      font-size: 13px;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s;
      font-family: inherit;
    }
    .quick-prompt:hover {
      background: rgba(99,102,241,0.12);
      border-color: rgba(99,102,241,0.3);
      color: var(--accent-2);
      transform: translateY(-1px);
    }

    /* ── Messages ───────────────────────────── */
    .message { display: flex; gap: 12px; animation: fadeUp 0.35s ease; }
    .message.user { flex-direction: row-reverse; }

    .message-avatar {
      width: 34px; height: 34px;
      border-radius: 10px;
      display: grid; place-items: center;
      font-size: 14px; font-weight: 700;
      flex-shrink: 0;
      margin-top: 2px;
    }
    .message.bot .message-avatar { background: var(--bg-glass); border: 1px solid var(--border); color: var(--accent-2); }
    .message.user .message-avatar { background: var(--user-bubble); color: #fff; }

    .message-content { max-width: 620px; }
    .message-bubble {
      padding: 14px 18px;
      border-radius: var(--radius);
      font-size: 14px;
      line-height: 1.65;
      word-wrap: break-word;
    }
    .message.bot .message-bubble {
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-top-left-radius: 4px;
      color: var(--text-primary);
    }
    .message.user .message-bubble {
      background: var(--user-bubble);
      border-top-right-radius: 4px;
      color: #fff;
    }

    /* ── Recommendation Cards ───────────────── */
    .rec-grid {
      display: grid;
      gap: 8px;
      margin-top: 12px;
    }
    .rec-card {
      background: rgba(255,255,255,0.03);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      padding: 14px 16px;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      transition: all 0.2s;
      text-decoration: none;
      color: inherit;
    }
    .rec-card:hover {
      background: rgba(99,102,241,0.08);
      border-color: rgba(99,102,241,0.25);
      transform: translateX(3px);
    }
    .rec-num {
      width: 26px; height: 26px;
      background: rgba(99,102,241,0.15);
      color: var(--accent-2);
      border-radius: 8px;
      display: grid; place-items: center;
      font-size: 12px; font-weight: 700;
      flex-shrink: 0;
      margin-top: 1px;
    }
    .rec-info { flex: 1; min-width: 0; }
    .rec-name { font-size: 13.5px; font-weight: 600; color: var(--text-primary); margin-bottom: 4px; }
    .rec-meta { display: flex; gap: 12px; flex-wrap: wrap; }
    .rec-tag {
      font-size: 11px;
      color: var(--text-muted);
      background: rgba(255,255,255,0.05);
      padding: 2px 8px;
      border-radius: 6px;
    }
    .rec-tag.type { color: var(--accent-2); background: rgba(99,102,241,0.12); }
    .rec-link-icon {
      color: var(--text-muted);
      font-size: 16px;
      margin-top: 3px;
      flex-shrink: 0;
      transition: color 0.2s;
    }
    .rec-card:hover .rec-link-icon { color: var(--accent-2); }

    /* ── Typing Indicator ───────────────────── */
    .typing-indicator {
      display: none;
      gap: 12px;
      animation: fadeUp 0.3s ease;
    }
    .typing-indicator.visible { display: flex; }
    .typing-dots {
      display: flex;
      gap: 5px;
      padding: 16px 20px;
      background: var(--bot-bubble);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      border-top-left-radius: 4px;
    }
    .typing-dots span {
      width: 7px; height: 7px;
      background: var(--text-muted);
      border-radius: 50%;
      animation: bounce 1.3s ease infinite;
    }
    .typing-dots span:nth-child(2) { animation-delay: 0.15s; }
    .typing-dots span:nth-child(3) { animation-delay: 0.3s; }
    @keyframes bounce {
      0%, 60%, 100% { transform: translateY(0); }
      30% { transform: translateY(-8px); }
    }

    /* ── End Banner ─────────────────────────── */
    .end-banner {
      text-align: center;
      padding: 16px;
      background: rgba(52,211,153,0.08);
      border: 1px solid rgba(52,211,153,0.2);
      border-radius: var(--radius-sm);
      color: var(--green);
      font-size: 13px;
      font-weight: 500;
      animation: fadeUp 0.4s ease;
    }

    /* ── Input Area ─────────────────────────── */
    .input-area {
      padding: 16px 20px 20px;
      background: rgba(17,24,39,0.9);
      backdrop-filter: blur(20px);
      border-top: 1px solid var(--border);
      flex-shrink: 0;
    }
    .input-wrapper {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      gap: 10px;
      align-items: flex-end;
    }
    .input-field {
      flex: 1;
      background: var(--bg-glass);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 14px 18px;
      color: var(--text-primary);
      font-size: 14px;
      font-family: inherit;
      resize: none;
      outline: none;
      min-height: 48px;
      max-height: 140px;
      line-height: 1.5;
      transition: border-color 0.2s;
    }
    .input-field::placeholder { color: var(--text-muted); }
    .input-field:focus { border-color: rgba(99,102,241,0.4); }

    .send-btn {
      width: 48px; height: 48px;
      background: var(--user-bubble);
      border: none;
      border-radius: 14px;
      display: grid; place-items: center;
      cursor: pointer;
      transition: all 0.2s;
      flex-shrink: 0;
    }
    .send-btn:hover { transform: scale(1.05); box-shadow: 0 4px 20px var(--accent-glow); }
    .send-btn:disabled { opacity: 0.4; cursor: not-allowed; transform: none; box-shadow: none; }
    .send-btn svg { width: 20px; height: 20px; fill: #fff; }

    .new-chat-btn {
      display: none;
      width: 100%;
      padding: 14px;
      background: var(--user-bubble);
      border: none;
      border-radius: 14px;
      color: #fff;
      font-size: 14px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.2s;
    }
    .new-chat-btn:hover { transform: scale(1.01); box-shadow: 0 4px 20px var(--accent-glow); }

    /* ── Animations ─────────────────────────── */
    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(12px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ── Responsive ─────────────────────────── */
    @media (max-width: 640px) {
      .header { padding: 14px 16px; }
      .chat-container { padding: 16px 12px; }
      .input-area { padding: 12px; }
      .welcome h2 { font-size: 22px; }
      .welcome { padding: 30px 10px 20px; }
      .quick-prompts { gap: 6px; }
      .quick-prompt { font-size: 12px; padding: 8px 14px; }
      .message-bubble { font-size: 13.5px; padding: 12px 15px; }
      .rec-card { padding: 12px; }
    }
  </style>
</head>
<body>

  <!-- Header -->
  <header class="header">
    <div class="header-logo">S</div>
    <div class="header-text">
      <h1>SHL Assessment Recommender</h1>
      <p>AI-powered assessment selection</p>
    </div>
    <div class="header-status">Online</div>
  </header>

  <!-- Chat -->
  <div class="chat-container" id="chatContainer">
    <div class="messages-wrapper" id="messagesWrapper">

      <!-- Welcome -->
      <div class="welcome" id="welcome">
        <div class="welcome-icon">🧠</div>
        <h2>Find the Right Assessments</h2>
        <p>Describe your hiring needs — the role, level, skills — and I'll recommend the best SHL assessments from the catalog.</p>
        <div class="quick-prompts">
          <button class="quick-prompt" onclick="usePrompt(this)">Hire a senior Java developer</button>
          <button class="quick-prompt" onclick="usePrompt(this)">High-volume customer service screening</button>
          <button class="quick-prompt" onclick="usePrompt(this)">Assess leadership for executive roles</button>
          <button class="quick-prompt" onclick="usePrompt(this)">Data analyst — entry level, English</button>
        </div>
      </div>

      <!-- Typing indicator -->
      <div class="typing-indicator" id="typingIndicator">
        <div class="message-avatar" style="background:var(--bg-glass);border:1px solid var(--border);color:var(--accent-2);">S</div>
        <div class="typing-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
  </div>

  <!-- Input -->
  <div class="input-area">
    <div class="input-wrapper" id="inputWrapper">
      <textarea class="input-field" id="inputField" placeholder="Describe your hiring needs..." rows="1"
        onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();sendMessage()}"
        oninput="autoResize(this)"></textarea>
      <button class="send-btn" id="sendBtn" onclick="sendMessage()">
        <svg viewBox="0 0 24 24"><path d="M2.01 21L23 12 2.01 3 2 10l15 2-15 2z"/></svg>
      </button>
      <button class="new-chat-btn" id="newChatBtn" onclick="resetChat()">✨ Start New Conversation</button>
    </div>
  </div>

<script>
// ── State ──────────────────────────────────────
const API_BASE = window.location.origin;
let conversationHistory = [];
let isLoading = false;
let conversationEnded = false;

// ── DOM refs ───────────────────────────────────
const chatContainer  = document.getElementById('chatContainer');
const messagesWrapper = document.getElementById('messagesWrapper');
const typingIndicator = document.getElementById('typingIndicator');
const inputField     = document.getElementById('inputField');
const sendBtn        = document.getElementById('sendBtn');
const newChatBtn     = document.getElementById('newChatBtn');
const welcome        = document.getElementById('welcome');

// ── Quick prompt ───────────────────────────────
function usePrompt(btn) {
  inputField.value = btn.textContent;
  inputField.focus();
  sendMessage();
}

// ── Auto resize textarea ───────────────────────
function autoResize(el) {
  el.style.height = 'auto';
  el.style.height = Math.min(el.scrollHeight, 140) + 'px';
}

// ── Scroll to bottom ──────────────────────────
function scrollToBottom() {
  requestAnimationFrame(() => {
    chatContainer.scrollTop = chatContainer.scrollHeight;
  });
}

// ── Render a message bubble ───────────────────
function addMessage(role, text, recommendations = []) {
  if (welcome) welcome.style.display = 'none';

  const msgDiv = document.createElement('div');
  msgDiv.className = `message ${role === 'user' ? 'user' : 'bot'}`;

  const avatar = document.createElement('div');
  avatar.className = 'message-avatar';
  avatar.textContent = role === 'user' ? 'U' : 'S';

  const content = document.createElement('div');
  content.className = 'message-content';

  const bubble = document.createElement('div');
  bubble.className = 'message-bubble';
  bubble.textContent = text;
  content.appendChild(bubble);

  // Recommendation cards
  if (recommendations.length > 0) {
    const grid = document.createElement('div');
    grid.className = 'rec-grid';
    recommendations.forEach((rec, i) => {
      const card = document.createElement('a');
      card.className = 'rec-card';
      card.href = rec.url;
      card.target = '_blank';
      card.rel = 'noopener noreferrer';
      card.innerHTML = `
        <div class="rec-num">${i + 1}</div>
        <div class="rec-info">
          <div class="rec-name">${escapeHtml(rec.name)}</div>
          <div class="rec-meta">
            <span class="rec-tag type">${escapeHtml(rec.test_type)}</span>
          </div>
        </div>
        <div class="rec-link-icon">↗</div>
      `;
      grid.appendChild(card);
    });
    content.appendChild(grid);
  }

  msgDiv.appendChild(avatar);
  msgDiv.appendChild(content);
  messagesWrapper.insertBefore(msgDiv, typingIndicator);
  scrollToBottom();
}

// ── Show end banner ───────────────────────────
function showEndBanner() {
  const banner = document.createElement('div');
  banner.className = 'end-banner';
  banner.textContent = '✅ Conversation complete — your recommendations are finalized above.';
  messagesWrapper.insertBefore(banner, typingIndicator);

  // Switch to new-chat mode
  inputField.style.display = 'none';
  sendBtn.style.display = 'none';
  newChatBtn.style.display = 'block';
  scrollToBottom();
}

// ── Send message ──────────────────────────────
async function sendMessage() {
  const text = inputField.value.trim();
  if (!text || isLoading || conversationEnded) return;

  // Add user message to UI and history
  addMessage('user', text);
  conversationHistory.push({ role: 'user', content: text });
  inputField.value = '';
  inputField.style.height = 'auto';

  isLoading = true;
  sendBtn.disabled = true;
  typingIndicator.classList.add('visible');
  scrollToBottom();

  try {
    const resp = await fetch(`${API_BASE}/chat`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: conversationHistory }),
    });

    if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
    const data = await resp.json();

    // Add assistant response to UI and history
    addMessage('bot', data.reply, data.recommendations || []);
    conversationHistory.push({ role: 'assistant', content: JSON.stringify(data) });

    if (data.end_of_conversation) {
      conversationEnded = true;
      showEndBanner();
    }
  } catch (err) {
    addMessage('bot', 'Something went wrong connecting to the server. Please try again.');
    console.error(err);
  } finally {
    isLoading = false;
    sendBtn.disabled = false;
    typingIndicator.classList.remove('visible');
    scrollToBottom();
    if (!conversationEnded) inputField.focus();
  }
}

// ── Reset chat ────────────────────────────────
function resetChat() {
  conversationHistory = [];
  conversationEnded = false;
  isLoading = false;

  // Clear messages except welcome + typing
  const children = [...messagesWrapper.children];
  children.forEach(c => {
    if (c.id !== 'welcome' && c.id !== 'typingIndicator') c.remove();
  });

  welcome.style.display = '';
  inputField.style.display = '';
  sendBtn.style.display = '';
  newChatBtn.style.display = 'none';
  inputField.focus();
}

// ── Utility ───────────────────────────────────
function escapeHtml(str) {
  const d = document.createElement('div');
  d.textContent = str;
  return d.innerHTML;
}

// Focus on load
inputField.focus();
</script>
</body>
</html>
